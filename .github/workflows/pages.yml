name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['front-end/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      # Served from https://<user>.github.io/<repo>/, so the base href is the repo name.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Deep links (e.g. /workout) fall back to the app instead of GitHub's 404 page.
      - run: cp dist/front-end/browser/index.html dist/front-end/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front-end/dist/front-end/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
